<div class="main">
  <div class="container">
    <!-- Header -->
    <section class="row header">
      <!-- Optional header content -->
    </section>

    <!-- Login Card Section -->
    <section class="row login-card">
      <div class="col-4 login-card__main">
        <div class="container">
          <div class="row">
            <div class="col">
              <h2 class="login-card__title">Sign In</h2>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <div class="login-card__input-group">
                <label for="email" class="login-card__input-title">Email or Phone Number</label>
                <input id="email" type="text" class="login-card__input" placeholder="" />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <div class="login-card__input-group login-card__input-group--password">
                <div class="login-card__input-wrapper">
                  <div class="login-card__input-wrapper-left">
                    <label for="password" class="login-card__input-title">Password</label>
                    <input id="password" type="password" class="login-card__input" placeholder="" />
                  </div>
                  <div class="login-card__input-wrapper-right">
                    <button
                      type="button"
                      class="login-card__input-eye"
                      aria-label="Show or hide password"
                    ></button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <div class="login-card__input-group login-card__input-group--button">
                <input type="button" class="login-card__input" value="Sign In" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <div class="login-card__input-group login-card__input-group--checkbox">
                <div class="login-card__input-wrapper">
                  <div class="login-card__input-wrapper-left">
                    <input id="checkbox" type="checkbox" class="login-card__input" placeholder="" />
                    <label for="checkbox" class="login-card__input-title">Remember me</label>
                  </div>
                  <div class="login-card__input-wrapper-right">
                    <span class="login-card__input-help">Need help?</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <div class="login-card__content login-card__content-signup">
                New to Netflix? <span class="">Sign up now.</span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <div class="login-card__content login-card__content-more">
                This page is protected by Google reCAPTCHA to ensure you're not a bot.
                <span class=""> Learn more.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <section class="row footer">
      <!-- Optional footer content -->
    </section>
  </div>
</div>
